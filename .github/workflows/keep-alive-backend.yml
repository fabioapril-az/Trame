# Tiene sveglio il backend .NET (app-trame-prod) sul piano gratuito F1 di
# Azure App Service, che non ha "Always On": dopo circa 20 minuti senza
# richieste Azure mette l'app a riposo, e il primo visitatore successivo
# aspetta ~7 secondi che si riavvii (misurato: /api/eventi 6,9s a freddo,
# 0,15s a caldo). Un ping ogni 10 minuti la tiene sempre sotto quella soglia.
#
# Costo zero: il repository è pubblico, e per i repository pubblici GitHub
# non conteggia i minuti di Actions. Il piano F1 ha un tetto di 60 minuti di
# CPU al giorno: una GET leggera ne usa una frazione di secondo, ~144 al
# giorno restano ben lontani dal limite.
#
# DISATTIVATO (2026-11-09): il trigger "schedule" di GitHub si è rivelato
# molto meno puntuale del previsto (misurato: 64 esecuzioni in ~335 ore,
# una ogni ~5h invece che ogni 10 minuti), quindi il backend restava
# comunque addormentato per lunghi periodi. Sostituito da un Availability
# Test di Azure Application Insights, gestito dal backend: ping ogni 5
# minuti da 5 sedi, sull'infrastruttura di test di Azure invece che su
# GitHub Actions. Il trigger "schedule" è commentato, non cancellato, nel
# caso serva ripristinarlo. workflow_dispatch resta per lanciarlo a mano.
#
# Un ping fallito (backend non raggiungibile dopo i tentativi) fa fallire il
# job, e GitHub manda un'email a chi ha modificato per ultimo questo file:
# un avviso gratuito, seppur grezzo, se il backend va giù.

name: Keep-alive backend

on:
  # schedule:
  #   - cron: "*/10 * * * *"
  # Per provarlo a mano dalla scheda Actions, senza aspettare l'orario.
  workflow_dispatch:

# Nessun permesso sul repository: il job fa solo una richiesta HTTP verso
# l'esterno, non legge né scrive niente qui.
permissions: {}

# Se un ping è ancora in corso (backend lento a svegliarsi) quando parte il
# successivo, non ne serve un secondo in parallelo.
concurrency:
  group: keep-alive-backend
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/impostazioni
        # /api/impostazioni: pubblico (nessun login), leggero, e tocca il
        # database — così si riscalda anche la connessione, non solo il
        # processo. Retry per assorbire il risveglio a freddo, che può
        # richiedere diversi secondi.
        run: |
          curl --fail --silent --show-error \
            --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors \
            --output /dev/null \
            --write-out "HTTP %{http_code} in %{time_total}s\n" \
            https://app-trame-prod.azurewebsites.net/api/impostazioni
