<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Accesso in corso…</title>
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <!--
    Pagina di redirect DEDICATA per MSAL.js, non protetta da nessuna regola
    di ruolo in staticwebapp.config.json. Bug reale trovato in test: se il
    redirect di login puntasse direttamente su admin.html (protetta dal
    ruolo "editor" della Static Web App), il ritorno da login.microsoftonline.com
    veniva intercettato dal controllo ruolo della Static Web App PRIMA che
    la pagina si caricasse — la richiesta era un normale "GET /admin.html"
    (il frammento #code=... nell'URL non viene mai inviato al server), che
    lo stesso ruolo "editor" della pagina poteva rifiutare con un altro
    redirect di login (quello della Static Web App, non il nostro) proprio
    nel momento del ritorno da un redirect cross-site — il codice OAuth non
    veniva mai elaborato, e la pagina sembrava richiedere il login
    all'infinito. Qui la richiesta è sempre pubblica: MSAL elabora la
    risposta, poi questa pagina stessa rimanda con un normale redirect
    "same-site" alla pagina di partenza (letta da result.state) — un
    secondo salto, ma solo così la Static Web App vede una normale
    navigazione interna, non un ritorno diretto da un altro dominio.
  -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.19.0/lib/msal-browser.min.js"></script>
  <script src="assets/js/trame-config.js"></script>
  <script>
    (function () {
      var msalInstance = new msal.PublicClientApplication({
        auth: {
          clientId: window.TRAME_CONFIG.msalClientId,
          authority: window.TRAME_CONFIG.msalAuthority,
          redirectUri: window.location.origin + "/auth-blank.html"
        },
        cache: {
          cacheLocation: "sessionStorage"
        }
      });

      function tornaAllaPagina(percorso) {
        window.location.replace(percorso && percorso.indexOf("/") === 0 ? percorso : "/admin.html");
      }

      msalInstance.initialize()
        .then(function () { return msalInstance.handleRedirectPromise(); })
        .then(function (result) {
          if (result && result.account) {
            msalInstance.setActiveAccount(result.account);
          }
          tornaAllaPagina(result && result.state);
        })
        .catch(function () {
          tornaAllaPagina(null);
        });
    })();
  </script>
</body>
</html>
